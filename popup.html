<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BibleBoost</title>
<style>
  /* Semantic tokens measured off bible.com. Their gray ramp is absolute and only
     the semantic layer flips by theme, so only this layer is redeclared below. */
  :root {
    color-scheme: light dark;
    --canvas:      #FFFFFF;
    --surface-2:   #F6F4F4;  /* row + field fill (their surface-elevated-secondary) */
    --surface-3:   #EDEBEB;  /* chips, disabled button (gray-10) */
    --border:      #DDDBDB;
    --text-1:      #121212;
    --text-2:      #636161;
    --text-3:      #828080;
    --switch-on:   #121212;
    --switch-off:  #DDDBDB;
    --knob:        #FFFFFF;
    --focus:       #3D79C2;  /* their blue-30 */
    /* A deepened YouVersion red. The brand #FF3D4D is only 3.48:1 against white, which
       passes AA as large text but not at a button label this size; #DE2E3C is 4.60:1.
       The dock keeps the brighter red because its switch track carries no text. */
    --brand:       #DE2E3C;
    --brand-hover: #C72736;
    --chevron:     #636161;
    /* The extension's radius scale, under this file's unprefixed names (B-019). 4px is a control,
       bible.com's own for the size and font options in its reader settings. A pill is a pill. The
       popup draws no floating surface of its own, since Chrome draws the window, so it has no
       --bb-radius-lg counterpart. */
    --radius:      4px;
    --radius-pill: 999px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:     #121212;
      --surface-2:  #353333;
      --surface-3:  #474545;
      --border:     #353333;
      --text-1:     #FFFFFF;
      --text-2:     #BFBDBD;
      --text-3:     #828080;
      --switch-on:  #636161;
      --switch-off: #474545;
      --chevron:    #BFBDBD;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    width: 340px;
    margin: 0;
    padding: 12px 12px 10px;
    /* The OS UI stack. Segoe UI Variable Text is installed on Windows 11 but measures
       identical in width to Segoe UI, so it is not listed: it would buy nothing and only
       add a resolution risk. system-ui resolves to Segoe UI here. */
    font: 400 13px/1.45 system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--canvas);
    color: var(--text-1);
  }

  select, input, button, kbd { font-family: inherit; }

  /* ---- header --------------------------------------------------------- */
  .brand { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  /* The one literal radius allowed: it softens the app icon's own square artwork and is not a
     surface or a control, so the scale does not apply (B-019). */
  .brand img { width: 20px; height: 20px; border-radius: 5px; }
  h1 {
    margin: 0;
    /* bible.com's scripture serif - the one place their serif voice belongs. */
    font: 700 15px/1.2 'Source Serif 4', Georgia, 'Times New Roman', serif;
    letter-spacing: -0.01em;
    color: var(--text-1);
  }

  /* ---- primary action -------------------------------------------------- */
  #open {
    display: block; width: 100%; height: 34px;
    border: 0; border-radius: var(--radius-pill, 999px);
    background: var(--brand); color: #fff;
    font-size: 13px; font-weight: 700; line-height: 1;
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  #open:hover:not(:disabled) { background: var(--brand-hover); }
  #open:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #open:disabled { background: var(--surface-3); color: var(--text-2); cursor: default; }

  #openNote {
    margin-top: 6px;
    font-size: 11px; line-height: 1.4;
    text-align: center;
    color: var(--text-3);
  }

  /* ---- section --------------------------------------------------------- */
  h2 {
    margin: 12px 0 6px;
    font-size: 11px; font-weight: 700;
    color: var(--text-2);
  }

  /* ---- settings rows (filled, --radius - their control pattern) -------- */
  .rows { display: flex; flex-direction: column; gap: 4px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    min-height: 32px; padding: 6px 10px;
    border-radius: var(--radius, 4px);
    background: var(--surface-2);
    cursor: pointer; user-select: none;
  }
  .row .label {
    flex: 1; min-width: 0;
    font-size: 12px; font-weight: 500;
    color: var(--text-3);
  }
  .row .note { font-weight: 400; font-size: 11px; color: var(--text-3); }
  .row.disabled { opacity: 0.45; pointer-events: none; }

  /* ---- toggle: a real checkbox, hidden but focusable; siblings styled ---- */
  /* Exactly half of bible.com's 64x32 track with its 32x24 stadium knob, which is also
     the size the on-page dock uses, so both surfaces show the same control. */
  .switch { position: relative; flex: none; width: 32px; height: 16px; }
  .switch input {
    position: absolute; width: 1px; height: 1px;
    margin: 0; padding: 0; opacity: 0;
    pointer-events: none;       /* the wrapping <label> owns the click */
  }
  .switch .track {
    position: absolute; inset: 0;
    border-radius: var(--radius-pill, 999px);
    background: var(--switch-off);
    transition: background-color 150ms ease;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 12px;   /* a stadium, not a circle - as on bible.com */
    border-radius: var(--radius-pill, 999px);
    background: var(--knob);
    transition: transform 150ms ease;
  }
  .switch input:checked ~ .track { background: var(--switch-on); }
  .switch input:checked ~ .knob  { transform: translateX(12px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---- version fields --------------------------------------------------- */
  .field { margin-top: 8px; }
  .field-label {
    display: block; margin-bottom: 4px;
    font-size: 11px; font-weight: 500;
    color: var(--text-3);
  }
  .select { position: relative; }
  .select::after {               /* chevron drawn in CSS so it inherits the theme */
    content: '';
    position: absolute; right: 12px; top: 50%;
    width: 6px; height: 6px; margin-top: -4px;
    border-right: 1.5px solid var(--chevron);
    border-bottom: 1.5px solid var(--chevron);
    transform: rotate(45deg);
    pointer-events: none;
  }
  select {
    width: 100%; height: 32px;
    padding: 0 30px 0 10px;
    font-size: 12.5px; font-weight: 500;
    color: var(--text-1);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius, 4px);
    appearance: none; -webkit-appearance: none;
    cursor: pointer;
  }
  select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* The transparent border is load-bearing: popup.js signals a bad paste with
     custom.style.borderColor = '#d33', which needs a non-zero border-width to show. */
  .custom {
    display: none;
    width: 100%; height: 30px; margin-top: 6px;
    padding: 0 10px;
    font-size: 12px;
    color: var(--text-1);
    background: var(--surface-2);
    border: 1.5px solid transparent;
    border-radius: var(--radius, 4px);
  }
  .custom::placeholder { color: var(--text-3); }
  .custom:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* ---- footer ----------------------------------------------------------- */
  .hint { margin-top: 10px; font-size: 11px; line-height: 1.5; color: var(--text-3); }
  kbd {
    display: inline-block; padding: 1px 4px;
    font-size: 10px; font-weight: 600; line-height: 1.5;
    color: var(--text-2);
    background: var(--surface-3);
    border-radius: var(--radius, 4px);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon48.png" alt="">
    <h1>BibleBoost</h1>
  </div>

  <button id="open">Open parallel reading</button>
  <div id="openNote"></div>

  <h2>Parallel reading</h2>

  <div class="rows">
    <label class="row" id="parallelRow">
      <span class="label">Parallel mode <span id="parallelNote" class="note"></span></span>
      <span class="switch"><input type="checkbox" id="parallel"><span class="track"></span><span class="knob"></span></span>
    </label>
    <label class="row">
      <span class="label">Align verses side by side</span>
      <span class="switch"><input type="checkbox" id="align"><span class="track"></span><span class="knob"></span></span>
    </label>
    <label class="row">
      <span class="label">Verse separators</span>
      <span class="switch"><input type="checkbox" id="separators"><span class="track"></span><span class="knob"></span></span>
    </label>
    <label class="row">
      <span class="label">Show switch on the page</span>
      <span class="switch"><input type="checkbox" id="showSwitch"><span class="track"></span><span class="knob"></span></span>
    </label>
  </div>

  <div class="field">
    <label class="field-label" for="leftVersion">Left version</label>
    <div class="select"><select id="leftVersion"></select></div>
    <input type="text" class="custom" id="leftCustom" placeholder="e.g. 1588 or a bible.com/bible/… URL">
  </div>

  <div class="field">
    <label class="field-label" for="rightVersion">Right version</label>
    <div class="select"><select id="rightVersion"></select></div>
    <input type="text" class="custom" id="rightCustom" placeholder="e.g. 1588 or a bible.com/bible/… URL">
  </div>

  <div class="hint">Shortcuts on bible.com: <kbd>Alt</kbd>+<kbd>P</kbd> parallel, <kbd>Alt</kbd>+<kbd>A</kbd> align, <kbd>Alt</kbd>+<kbd>S</kbd> separators.<br>
  Both versions and your last chapter are remembered as you read.</div>
<script type="module" src="popup.js"></script>
</body>
</html>
