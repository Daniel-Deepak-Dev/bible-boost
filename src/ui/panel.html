<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BibleBoost notes</title>
  <!-- Before anything that paints: it puts bible.com's theme class on <html> from the address, so
       the first frame is already in the right palette (T-020). Classic and blocking on purpose. -->
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    /* The panel's frame. The theme is bible.com's, relayed by panel-host.js as html.light or html.dark
       (T-020). Where no class arrives, theme.css falls back to the OS, so the panel is still readable
       if the relay fails entirely (R5).

       The fill is the solid --bb-surface-2 and not the dock's translucent surface. This sits over
       verses, and a backdrop blur cannot reach through a frame, so anything translucent here would
       show the verse text straight through what is written on it. */
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bb-surface-2, #F6F4F4);
      color: var(--bb-text, #121212);
      font: 400 14px/normal aktiv-grotesk, system-ui, 'Segoe UI', Arial, sans-serif;
    }

    /* Compact because EPIC-02 says so. The pin (T-018) and the × are the only controls at rest. */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--bb-gap-sm, 4px) var(--bb-gap-sm, 4px) var(--bb-gap-sm, 4px) 12px;
      border-bottom: 1px solid var(--bb-surface-3, #EDEBEB);
      font-weight: 700;
    }

    /* The note list (T-021) does its own scrolling, so that its status line and its rows can sit in
       one column and only the rows scroll. */
    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .bb-tools { display: flex; gap: 2px; }

    #bb-pin,
    #bb-close {
      padding: 2px 8px;
      border: 0;
      border-radius: var(--bb-radius, 4px);
      background: transparent;
      color: var(--bb-text-2, #636161);
      font: inherit;
      cursor: pointer;
    }

    #bb-pin:hover,
    #bb-close:hover { background: var(--bb-hover, rgba(8, 7, 7, 0.08)); }
    #bb-pin:focus-visible,
    #bb-close:focus-visible { outline: 2px solid var(--bb-focus, #3D79C2); outline-offset: -2px; }

    /* The pin is Tabler Icons' "pin" (MIT), from the same set as the dock's swap icon, stroked in
       currentColor so it follows the text colour of whichever theme the panel is in. 16px with 3px
       above and below is meant to come out at the ×'s own height, a 14px line with 2px of padding, so
       that showing the pin does not make the row grow.

       The state is aria-pressed and nothing else, so what a screen reader announces and what is drawn
       cannot disagree. Pressed, it takes the full text colour and a fill one step off the panel's own:
       --bb-surface-3 on --bb-surface-2. The [hidden] rule is needed because display: flex beats the
       browser's own, and the host hides the pin wherever the window is too narrow to squeeze (R6). */
    #bb-pin {
      display: flex;
      align-items: center;
      padding: 3px 6px;
    }

    #bb-pin[hidden] { display: none; }

    #bb-pin[aria-pressed="true"] {
      background: var(--bb-surface-3, #EDEBEB);
      color: var(--bb-text, #121212);
    }

    #bb-pin svg {
      display: block;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <header>
    <span>BibleBoost</span>
    <div class="bb-tools">
      <button id="bb-pin" type="button" aria-pressed="false" aria-label="Pin beside the page" title="Pin beside the page" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5 -1.5l1.5 -4l4 -4" />
          <path d="M9 15l-4.5 4.5" />
          <path d="M14.5 4l5.5 5.5" />
        </svg>
      </button>
      <button id="bb-close" type="button" aria-label="Close panel">×</button>
    </div>
  </header>
  <main></main>
  <script type="module" src="panel.js"></script>
</body>
</html>
