<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BibleBoost notes</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    /* The shell only, until T-021 gives the panel something to show. It follows the OS until T-020
       relays bible.com's theme, because the html.light / html.dark in theme.css are not set yet.

       The fill is the solid --bb-surface-2 and not the dock's translucent surface. This sits over
       verses, and a backdrop blur cannot reach through a frame, so anything translucent here would
       show the verse text straight through what is written on it. */
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bb-surface-2, #F6F4F4);
      color: var(--bb-text, #121212);
      font: 400 14px/normal aktiv-grotesk, system-ui, 'Segoe UI', Arial, sans-serif;
    }

    /* Compact because EPIC-02 says so. T-018 puts its pin control in this row. */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--bb-gap-sm, 4px) var(--bb-gap-sm, 4px) var(--bb-gap-sm, 4px) 12px;
      border-bottom: 1px solid var(--bb-surface-3, #EDEBEB);
      font-weight: 700;
    }

    main { flex: 1; min-height: 0; overflow: auto; }

    #bb-close {
      padding: 2px 8px;
      border: 0;
      border-radius: var(--bb-radius, 4px);
      background: transparent;
      color: var(--bb-text-2, #636161);
      font: inherit;
      cursor: pointer;
    }

    #bb-close:hover { background: var(--bb-hover, rgba(8, 7, 7, 0.08)); }
    #bb-close:focus-visible { outline: 2px solid var(--bb-focus, #3D79C2); outline-offset: -2px; }
  </style>
</head>
<body>
  <header>
    <span>BibleBoost</span>
    <button id="bb-close" type="button" aria-label="Close panel">×</button>
  </header>
  <main></main>
  <script type="module" src="panel.js"></script>
</body>
</html>
