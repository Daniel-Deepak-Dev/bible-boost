<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BibleBoost notes</title>
  <!-- Before anything that paints: it puts bible.com's theme class on <html> from the address, so
       the first frame is already in the right palette (T-020). Classic and blocking on purpose. -->
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    /* The panel's frame. The theme is bible.com's, relayed by panel-host.js as html.light or html.dark
       (T-020). Where no class arrives, theme.css falls back to the OS, so the panel is still readable
       if the relay fails entirely (R5).

       The fill is the solid --bb-surface-2 and not the dock's translucent surface. This sits over
       verses, and a backdrop blur cannot reach through a frame, so anything translucent here would
       show the verse text straight through what is written on it. */
    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bb-surface-2, #F6F4F4);
      color: var(--bb-text, #121212);
      font: 400 14px/normal aktiv-grotesk, system-ui, 'Segoe UI', Arial, sans-serif;
    }

    /* Compact because EPIC-02 says so. One row: the scope (T-023) where the title was, then New note
       (T-022), the pin (T-018) and the ×. The title gave way to the scope because the two do not fit side
       by side at 280px, and the user chose the scope from a mock (2026-11-12). The frame's own title
       still names the panel for a screen reader. */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--bb-gap-sm, 4px);
      padding: var(--bb-gap-sm, 4px);
      border-bottom: 1px solid var(--bb-surface-3, #EDEBEB);
    }

    /* R2, the scope: one group of three, as the mock drew it, "[Chap 3|Book 12|All 40]". The group is
       the control, so it takes --bb-radius and clips the segments, and the segments draw no corners of
       their own (02-css-and-theming.md, Corner radius, rule 4).

       Drawn with fills and not a border, the way the editor's fields are: dark --bb-border is the same
       #353333 as the dark panel, and a bordered group vanished there when it was first tried. So the
       group is a --bb-surface-3 track, the checked segment takes --bb-surface in the full text colour,
       and the lines between segments are the panel's own --bb-surface-2, which shows on the track in
       both themes. --bb-text-2 on the track is 5.4:1 light and 6:1 dark.

       min-width: 0 lets the group give way before the buttons beside it do, should a count be wide. 12px
       on a 16px line with 3px above and below comes to the 22px of the buttons beside it, so the header
       keeps its height. normal is not used for the line: the words are ASCII and the digits are the
       font's, so no script is taller here than the 16px it is given. At 280px the three measured 146px
       with the pin showing, leaving 50px spare. */
    #bb-scope {
      display: flex;
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      border-radius: var(--bb-radius, 4px);
      background: var(--bb-surface-3, #EDEBEB);
    }

    #bb-scope button {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      padding: 3px 8px;
      border: 0;
      background: transparent;
      color: var(--bb-text-2, #636161);
      font: 600 12px/16px aktiv-grotesk, system-ui, 'Segoe UI', Arial, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }

    #bb-scope button + button { box-shadow: inset 1px 0 var(--bb-surface-2, #F6F4F4); }

    #bb-scope button:hover { background: var(--bb-hover, rgba(8, 7, 7, 0.08)); }

    #bb-scope button[aria-checked="true"] {
      background: var(--bb-surface, rgba(255, 255, 255, 0.92));
      color: var(--bb-text, #121212);
    }

    /* Chap and Book on a book intro (R9), kept in place so the header does not change shape. */
    #bb-scope button[aria-disabled="true"] {
      opacity: 0.5;
      cursor: default;
    }

    #bb-scope button[aria-disabled="true"]:hover { background: transparent; }

    #bb-scope button:focus { outline: none; }
    #bb-scope button:focus-visible { outline: 2px solid var(--bb-focus, #3D79C2); outline-offset: -2px; }

    /* R3's count, lighter than its word and in tabular figures, so 9 to 10 does not jolt the row. */
    .bb-count {
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .bb-count:empty { display: none; }

    /* R6. The chapter changed while a note is open, and the list waits for it to close. One quiet line
       under the header saying so, with a way to switch now. In the flow, so it pushes the list down
       rather than covering its first row. */
    .bb-reading {
      display: flex;
      align-items: center;
      gap: var(--bb-gap-md, 8px);
      padding: var(--bb-gap-sm, 4px) var(--bb-gap-sm, 4px) var(--bb-gap-sm, 4px) 12px;
      border-bottom: 1px solid var(--bb-surface-3, #EDEBEB);
      color: var(--bb-text-2, #636161);
      font-size: 12px;
      line-height: normal;
    }

    .bb-reading[hidden] { display: none; }

    .bb-reading-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* The note list (T-021) does its own scrolling, so that its status line and its rows can sit in
       one column and only the rows scroll. */
    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .bb-tools { display: flex; gap: 2px; }

    #bb-new,
    #bb-pin,
    #bb-close {
      padding: 2px 8px;
      border: 0;
      border-radius: var(--bb-radius, 4px);
      background: transparent;
      color: var(--bb-text-2, #636161);
      font: inherit;
      cursor: pointer;
    }

    #bb-new:hover,
    #bb-pin:hover,
    #bb-close:hover { background: var(--bb-hover, rgba(8, 7, 7, 0.08)); }
    #bb-new:focus-visible,
    #bb-pin:focus-visible,
    #bb-close:focus-visible { outline: 2px solid var(--bb-focus, #3D79C2); outline-offset: -2px; }

    /* The pin is Tabler Icons' "pin" (MIT), from the same set as the dock's swap icon, stroked in
       currentColor so it follows the text colour of whichever theme the panel is in. 16px with 3px
       above and below is meant to come out at the ×'s own height, a 14px line with 2px of padding, so
       that showing the pin does not make the row grow.

       The state is aria-pressed and nothing else, so what a screen reader announces and what is drawn
       cannot disagree. Pressed, it takes the full text colour and a fill one step off the panel's own:
       --bb-surface-3 on --bb-surface-2. The [hidden] rule is needed because display: flex beats the
       browser's own, and the host hides the pin wherever the window is too narrow to squeeze (R6).

       New note is Tabler Icons' "plus", drawn the same way and the same size, so the three controls
       share one height. */
    #bb-new,
    #bb-pin {
      display: flex;
      align-items: center;
      padding: 3px 6px;
    }

    #bb-pin[hidden] { display: none; }

    #bb-pin[aria-pressed="true"] {
      background: var(--bb-surface-3, #EDEBEB);
      color: var(--bb-text, #121212);
    }

    #bb-new svg,
    #bb-pin svg {
      display: block;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <header>
    <div id="bb-scope" role="radiogroup" aria-label="Show notes from">
      <button type="button" role="radio" data-bb-scope="chapter" aria-checked="true" aria-label="This chapter">Chap<span class="bb-count"></span></button>
      <button type="button" role="radio" data-bb-scope="book" aria-checked="false" aria-label="This book" tabindex="-1">Book<span class="bb-count"></span></button>
      <button type="button" role="radio" data-bb-scope="all" aria-checked="false" aria-label="All" tabindex="-1">All<span class="bb-count"></span></button>
    </div>
    <div class="bb-tools">
      <button id="bb-new" type="button" aria-label="New note" title="New note">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5l0 14" />
          <path d="M5 12l14 0" />
        </svg>
      </button>
      <button id="bb-pin" type="button" aria-pressed="false" aria-label="Pin beside the page" title="Pin beside the page" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5 -1.5l1.5 -4l4 -4" />
          <path d="M9 15l-4.5 4.5" />
          <path d="M14.5 4l5.5 5.5" />
        </svg>
      </button>
      <button id="bb-close" type="button" aria-label="Close panel">×</button>
    </div>
  </header>
  <div id="bb-reading" class="bb-reading" role="status" hidden>
    <span class="bb-reading-text"></span>
    <button type="button" class="bb-btn">Show</button>
  </div>
  <main></main>
  <script type="module" src="panel.js"></script>
</body>
</html>
